{% load wagtailcore_tags wagtailimages_tags %}<article class="card p-3">{% if edition.poster %}{% image edition.poster fill-420x560 as poster %}<img src="{{ poster.url }}" width="{{ poster.width }}" height="{{ poster.height }}" alt="Affiche Strasbulles {{ edition.year }}" class="w-full border border-ink">{% else %}<div class="grid aspect-[3/4] place-items-center bg-ink text-paper"><span class="font-display text-3xl">{{ edition.year }}</span></div>{% endif %}<h3 class="mt-3 text-xl"><a class="card-link no-underline" href="{% pageurl edition %}">{{ edition.year }}</a></h3></article>
