{% load wagtailcore_tags wagtailimages_tags %}<article class="card flex flex-col">{% if post.featured_image %}{% image post.featured_image fill-720x440 as card_image %}<img class="-mx-5 -mt-5 mb-5 w-[calc(100%+2.5rem)] border-b-2 border-ink object-cover" src="{{ card_image.url }}" width="{{ card_image.width }}" height="{{ card_image.height }}" alt="{{ post.image_alt }}">{% endif %}<p class="eyebrow">{{ post.category|default:"Chronique" }} · {{ post.publication_date|date:"j F Y" }}</p><h3><a class="card-link no-underline" href="{% pageurl post %}">{{ post.title }}</a></h3><p class="mt-3">{{ post.introduction|truncatewords:24 }}</p></article>
