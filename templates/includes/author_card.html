{% load wagtailcore_tags wagtailimages_tags %}<article class="card">{% if author.portrait %}{% image author.portrait fill-500x560 as portrait %}<img class="-mx-5 -mt-5 mb-5 w-[calc(100%+2.5rem)] border-b-2 border-ink object-cover" src="{{ portrait.url }}" width="{{ portrait.width }}" height="{{ portrait.height }}" alt="{{ author.portrait_alt }}">{% else %}<div class="-mx-5 -mt-5 mb-5 grid aspect-square place-items-center border-b-2 border-ink bg-paper text-5xl" aria-hidden="true">✦</div>{% endif %}<h3><a class="card-link no-underline" href="{% pageurl author %}">{{ author.title }}</a></h3><p>{{ author.discipline }}</p></article>
